  <!-- Subtle Aqua Aura around head -->
  <circle cx="64" cy="46" r="23" fill="none" stroke="url(#cyanAccent)" stroke-width="2" stroke-opacity="0.8" />

  <!-- User Body / Aquatic Wave Shoulder -->
  <path d="M26 104 C26 78, 44 74, 64 74 C84 74, 102 78, 102 104 C92 116, 78 122, 64 122 C50 122, 36 116, 26 104 Z" fill="#E0F7FA" />

  <!-- Wave overlay accent -->

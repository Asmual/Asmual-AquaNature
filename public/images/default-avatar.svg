<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="aquaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B4A6F" />
      <stop offset="100%" stop-color="#083A57" />
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="64" cy="64" r="64" fill="url(#aquaGradient)" />

  <!-- Outer Ring Accent -->
  <circle cx="64" cy="64" r="61" fill="none" stroke="#22D3EE" stroke-width="3" stroke-opacity="0.5" />

  <!-- Stylized Aquatic Creature / User Avatar -->
  <!-- User Head -->
